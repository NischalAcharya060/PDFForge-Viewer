name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v1.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, sign and publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Warn if version does not match tag
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:RELEASE_TAG -replace '^v', ''
          if ($pkg -ne $tag) {
            Write-Host "::warning::package.json version $pkg does not match tag $tag"
          }

      - name: Build installer
        run: npm run dist

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No installer .exe found in dist/" }
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer: $($exe.FullName)"

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ github.run_id }}
          path: ${{ steps.installer.outputs.path }}
          archive: false
          retention-days: 1

      - name: Submit signing request to SignPath
        id: signing
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      - name: Resolve publish artifact and checksum
        id: publish
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed -Filter *.exe -File -Recurse -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          if ($signed) {
            $path = $signed.FullName
            Write-Host "::notice::Publishing SIGNED installer"
          } else {
            $path = '${{ steps.installer.outputs.path }}'
            Write-Host "::notice::No signed artifact found, publishing UNSIGNED installer"
          }
          $hash = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $path)" | Out-File -FilePath checksums.txt -Encoding utf8
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA256 $hash"

      - name: Verify Authenticode signature
        if: ${{ steps.signing.outputs.signing-request-id != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature '${{ steps.publish.outputs.path }}'
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          ASSET: ${{ steps.publish.outputs.path }}
          SHA: ${{ steps.publish.outputs.sha256 }}
        run: |
          gh release create $env:TAG $env:ASSET checksums.txt --title "PDFForge Viewer $env:TAG" --notes "SHA256: $env:SHA" --verify-tag --latest
